<!DOCTYPE html>
<html lang="en">
<head>
  
<script>
const STORAGE_KEY = 'oluearn_demo_v1';

let points = 0;
let completed = 0;
let done = {};

function saveProgress() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    points,
    completed,
    done
  }));
}

function updateWallet() {
  document.getElementById('balance').textContent = points;
  document.getElementById('walletBalance').textContent = points;
  document.getElementById('completed').textContent = completed;
}

function loadProgress() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    points = Number.isFinite(saved.points) ? saved.points : 0;
    completed = Number.isFinite(saved.completed) ? saved.completed : 0;
    done = saved.done && typeof saved.done === 'object'
      ? saved.done : {};
  } catch (error) {
    points = 0;
    completed = 0;
    done = {};
  }

  document.querySelectorAll('button[onclick^="completeTask"]').forEach(button => {
    const match = button.getAttribute('onclick').match(/completeTask\('([^']+)'/);
    if (match && done[match[1]]) {
      button.textContent = 'Demo completed';
      button.disabled = true;
    }
  });

  updateWallet();
}

function completeTask(id, reward, button) {
  if (done[id]) {
    alert('You have already completed this demo task.');
    return;
  }

  done[id] = true;
  points += reward;
  completed++;

  button.textContent = 'Demo completed';
  button.disabled = true;

  saveProgress();
  updateWallet();

  alert(
    'Demo complete! ' + reward +
    ' sample points added. These points have no cash value.'
  );
}

function showReferral() {
  document.getElementById('referralMessage').textContent =
    'Demo only: referral links will be available after real accounts are implemented.';
}

function requestWithdrawal() {
  document.getElementById('withdrawMessage').textContent =
    'Demo only: no withdrawal was sent, no bank details were collected, and no money was paid.';
}

loadProgress();
</script>
</body>
</html>
